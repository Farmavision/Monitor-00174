<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Farmacia Universale v2.0 - PharmLink</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0a192f; color: white; 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            
            /* --- OTTIMIZZAZIONI KIOSK --- */
            cursor: none; /* Nasconde il cursore del mouse */
            user-select: none; /* Impedisce la selezione del testo */
            -webkit-user-select: none;
            touch-action: manipulation; /* Ottimizza il tocco ed evita zoom accidentali */
        }

        /* Nasconde la barra di scorrimento ma permette lo scroll interno */
        ::-webkit-scrollbar {
            display: none;
        }

        /* --- LAYOUT 18-50-32 --- */
        #header { 
            flex: 0 0 18vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-bottom: 6px solid #00ff88; position: relative;
            padding: 5px 0;
            transition: background-color 0.5s ease;
        }

        #container-main { 
            flex: 0 0 50vh; 
            padding: 20px; 
            overflow-y: auto; 
        }

        #footer-promo {
            flex: 0 0 32vh; 
            width: 100%;
            background-color: white; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* --- STILI HEADER --- */
        #clock { font-size: 1.2rem; color: #00ff88; font-weight: bold; position: absolute; top: 10px; right: 20px; }
        
        .label-static { 
            font-size: 1.6rem; 
            color: #ffffff; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: -10px;
            opacity: 0.8;
        }

        #txt-nome { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            font-size: 3.8rem; 
            font-weight: 900; 
            color: #ffffff; 
            text-transform: uppercase; 
            line-height: 1; 
            margin: 5px 0;
            text-align: center;
        }

        /* --- SUPPORTO ORIENTAMENTO VERTICALE --- */
        body.v { flex-direction: column; }
        
        body.v #header { 
            flex: 0 0 22vh; 
            padding: 10px;
        }

        body.v #txt-nome { 
            font-size: 2.8rem; 
            text-align: center;
            flex-wrap: wrap;
            line-height: 1.1;
        }

        body.v #container-main { flex: 0 0 48vh; }
        body.v #footer-promo { flex: 0 0 30vh; }

        body.v .card h3 { font-size: 1.5rem; } 
        body.v .card p { font-size: 1.1rem; }

        .croce { color: #00ff88; font-size: 1.2em; animation: pulse-farmacia 2s infinite ease-in-out; }
        @keyframes pulse-farmacia { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        #stato-testo { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; }
        #orario-dettaglio { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; }

        /* Stati di colore Header */
        .aperto { background: #064e3b; }
        .chiuso { background: #b91c1c; border-bottom-color: #ff4444 !important; }
        .errore-rete { background: #333333; border-bottom-color: #ffcc00 !important; } 
        
        .testo-aperto { color: #00ff88 !important; }
        .testo-chiuso { color: #ffffff !important; }
        .testo-errore { color: #ffcc00 !important; }
        
        .chiuso .croce { color: white; }
        .errore-rete .croce { color: #777777; animation: none; }

        /* --- CARD TURNI --- */
        #titolo-turni { text-align: center; color: #00ff88; font-size: 1.3rem; margin-bottom: 15px; text-transform: uppercase; }
        .card { background: #172a45; margin-bottom: 15px; padding: 15px; border-radius: 15px; border: 2px solid #233554; display: flex; align-items: center; }
        .card-info { flex: 1; }
        .card h3 { color: #00ff88; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 5px; }
        .card p { font-size: 1.3rem; color: #cbd5e1; }
        .qr-wrapper img { width: 90px; height: 90px; border-radius: 8px; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="header">
        <div id="clock">--:--:--</div>
        <div class="label-static">FARMACIA</div>
        <div id="txt-nome">
            <span class="croce">✚</span>
            <span id="nome-testo-dinamico">CARICAMENTO...</span>
            <span class="croce">✚</span>
        </div>
        <div id="stato-testo">---</div>
        <div id="orario-dettaglio">Sincronizzazione in corso...</div>
    </div>

    <div id="container-main">
        <h2 id="titolo-turni">FARMACIE DI TURNO CHE EFFETTUANO SERVIZIO ASSISTENZIALE H24 NELLA ZONA</h2>
        <div id="body-turni"></div>
    </div>

    <div id="footer-promo">
        <div style="color: #0a192f; font-weight: 900; font-size: 2rem;">IN ATTESA DATI...</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE CHIAVE API GOOGLE CALENDAR
        // ==========================================
        const GOOGLE_API_KEY = "INSERISCI_QUI_LA_TUA_GOOGLE_API_KEY";

        // --- BLOCCO EVENTI KIOSK ---
        window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen ignorato: ${err.message}`);
                });
            }
        }
        window.addEventListener('click', toggleFullScreen);
        // ---------------------------

        function updateClock() { 
            const ora = new Date().toLocaleTimeString('it-IT');
            if(document.getElementById('clock')) document.getElementById('clock').innerText = ora; 
        }
        setInterval(updateClock, 1000);

        // --- NUOVA FUNZIONE DI SINCRONIZZAZIONE GOOGLE CALENDAR ---
        async function controlloAperturaCalendario(calendarId) {
            if (!calendarId) {
                impostaErroreCalendario("ID Calendario non configurato nel DB");
                return;
            }
            if (GOOGLE_API_KEY === "INSERISCI_QUI_LA_TUA_GOOGLE_API_KEY") {
                impostaErroreCalendario("Inserire API Key valida nel codice");
                return;
            }

            const adesso = new Date();
            const timeMin = adesso.toISOString();
            
            // Richiediamo i prossimi 2 eventi futuri o in corso (ordinati per orario di inizio)
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?timeMin=${timeMin}&maxResults=2&singleEvents=true&orderBy=startTime&key=${GOOGLE_API_KEY}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Risposta non valida dalle API Calendar");
                const data = await res.json();

                const headerEl = document.getElementById('header');
                const statoEl = document.getElementById('stato-testo');
                const dettEl = document.getElementById('orario-dettaglio');

                if (data.items && data.items.length > 0) {
                    const primoEvento = data.items[0];
                    const startEv = new Date(primoEvento.start.dateTime || primoEvento.start.date);
                    const endEv = new Date(primoEvento.end.dateTime || primoEvento.end.date);

                    // LOGICA: Se l'evento più vicino è già iniziato ed è tuttora in corso -> APERTO
                    if (startEv <= adesso && endEv > adesso) {
                        headerEl.className = "aperto";
                        statoEl.innerText = primoEvento.summary ? primoEvento.summary.toUpperCase() : "APERTO";
                        statoEl.className = "testo-aperto";
                        
                        const oraFineStr = endEv.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                        dettEl.innerText = "APERTO FINO ALLE ORE " + oraFineStr;
                    } 
                    // Se l'evento più vicino inizia nel futuro -> CHIUSO (calcola la riapertura)
                    else {
                        headerEl.className = "chiuso";
                        statoEl.innerText = "ATTUALMENTE CHIUSA";
                        statoEl.className = "testo-chiuso";

                        let oraInizioStr = startEv.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                        
                        // Controllo se riapre oggi o nei prossimi giorni
                        if (startEv.toDateString() === adesso.toDateString()) {
                            dettEl.innerText = "RIAPRE OGGI ALLE ORE " + oraInizioStr;
                        } else {
                            const nomeGiorno = startEv.toLocaleDateString('it-IT', { weekday: 'long' }).toUpperCase();
                            dettEl.innerText = `RIAPRE ${nomeGiorno} ALLE ORE ${oraInizioStr}`;
                        }
                    }
                } else {
                    // Calendario vuoto (Nessun evento futuro registrato)
                    headerEl.className = "chiuso";
                    statoEl.innerText = "ATTUALMENTE CHIUSA";
                    statoEl.className = "testo-chiuso";
                    dettEl.innerText = "CONSULTARE GLI ORARI DI TURNO QUI SOTTO";
                }
            } catch (error) {
                console.error("Errore Calendario:", error);
                impostaErroreCalendario("Errore Sincronizzazione Live Orari");
            }
        }

        function impostaErroreCalendario(messaggio) {
            document.getElementById('header').className = "errore-rete";
            document.getElementById('stato-testo').innerText = "CALENDARIO OFFLINE";
            document.getElementById('stato-testo').className = "testo-errore";
            document.getElementById('orario-dettaglio').innerText = messaggio;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // --- AGGIORNATO CON I NUOVI INDICI DEL DATABASE "PharmLink DB" ---
        async function processaDatiCSV(txt, isOffline = false) {
            const urlParams = new URLSearchParams(window.location.search);
            const MIO_ID = urlParams.get('id') || "RM001"; // Default aggiornato al nuovo screen

            const righe = txt.split(/\r?\n/).map(r => 
                r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                 .map(v => v.replace(/^"|"$/g, '').trim())
            );
            
            let turniHtml = "";
            let ownerTrovato = false;

            for (let i = 1; i < righe.length; i++) {
                const r = righe[i];
                if (!r[1]) continue;

                // OWNER MONITOR PROPRIO (Colonna N -> r[13] === "O")
                if (r[0] === MIO_ID && r[13] === "O") {
                    ownerTrovato = true;
                    document.getElementById('nome-testo-dinamico').innerText = r[1]; // Colonna B
                    
                    // Estraggo l'ID Calendario (Colonna H -> r[7])
                    const idCalendario = r[7] ? r[7].trim() : "";
                    
                    // Lancio il controllo asincrono del calendario
                    controlloAperturaCalendario(idCalendario);

                    // GESTIONE SMART FOOTER (GIORNO VS NOTTE)
                    const oraAttuale = new Date().getHours();
                    let linkSelezionato = "";
                    
                    // Fascia diurna elastica (es: dalle 07:00 alle 19:59 usa Giorno, altrimenti Notte)
                    if (oraAttuale >= 7 && oraAttuale < 20) {
                        linkSelezionato = r[5]; // Colonna F -> Footer Giorno
                    } else {
                        linkSelezionato = r[6]; // Colonna G -> Footer Notte
                    }

                    const comandoCSV = linkSelezionato ? linkSelezionato.trim() : ""; 
                    const footerEl = document.getElementById('footer-promo');
                    
                    if (comandoCSV !== "") {
                        footerEl.innerHTML = `<iframe src="player.html?data=${encodeURIComponent(comandoCSV)}" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`;
                    } else {
                        footerEl.innerHTML = `<div style="font-size:3.5rem; font-weight:900; color:#0a192f; text-align:center;">BENVENUTI</div>`;
                    }
                } 
                // FARMACIE DI TURNO COMPLEMENTARI (Colonna N -> r[13] === "T")
                else if (r[13] === "T") {
                    // QR Code generato dal link mappa (Colonna E -> r[4])
                    const qr = r[4] ? `<div class="qr-wrapper"><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(r[4])}"></div>` : "";
                    
                    const nomeT = escapeHTML(r[1]); // Colonna B
                    const indT = escapeHTML(r[2]);  // Colonna C

                    turniHtml += `
                        <div class="card">
                            <div class="card-info">
                                <div style="font-size:0.8rem; color:#94a3b8; font-weight:800;">FARMACIA DI TURNO</div>
                                <h3>${nomeT}</h3>
                                <p>${indT}</p>
                            </div>
                            ${qr}
                        </div>`;
                }
            }

            if (!ownerTrovato) {
                document.getElementById('nome-testo-dinamico').innerText = "ID " + MIO_ID + " NON TROVATO";
                document.getElementById('header').className = "errore-rete";
                document.getElementById('stato-testo').innerText = "---";
                document.getElementById('orario-dettaglio').innerText = "Verifica Codice ID in URL o nel database";
            }
            
            document.getElementById('body-turni').innerHTML = turniHtml;
        }

        async function carica() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // --- GESTIONE ORIENTAMENTO ---
            const MIO_DIR = urlParams.get('dir') || "h"; 
            if (MIO_DIR === "v") {
                document.body.classList.add('v');
            } else {
                document.body.classList.remove('v');
            }

            const MIO_GID = urlParams.get('gid') || "0"; 

            // Link di pubblicazione aggiornato all'ID del nuovo foglio "PharmLink DB"
            const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vI14V6H7ouoDRHdYag_mwTri0TFOdhgRbL6blYPuVoPFs/pub";
            const urlCompleto = `${baseUrl}?gid=${MIO_GID}&single=true&output=csv`;

            try {
                const res = await fetch(urlCompleto + "&t=" + Date.now());
                if (!res.ok) throw new Error("Risposta non OK dal server Google");
                
                const txt = await res.text();
                localStorage.setItem('cacheFarmacia', txt);
                
                processaDatiCSV(txt, false);

            } catch(e) { 
                console.error("Errore di Rete:", e); 
                const txtCache = localStorage.getItem('cacheFarmacia');
                
                if (txtCache) {
                    processaDatiCSV(txtCache, true);
                } else {
                    document.getElementById('nome-testo-dinamico').innerText = "ERRORE CONNESSIONE";
                    document.getElementById('header').className = "errore-rete";
                    document.getElementById('stato-testo').innerText = "OFFLINE";
                    document.getElementById('stato-testo').className = "testo-errore";
                    document.getElementById('orario-dettaglio').innerText = "Nessun dato in memoria. In attesa di rete...";
                    document.getElementById('body-turni').innerHTML = `<h3 style="color:#ffcc00; text-align:center; margin-top:20px;">Riconnessione in corso...</h3>`;
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setTimeout(carica, 5000); // Avvio sicuro a 5 secondi
            setInterval(carica, 600000); // Aggiornamento DB ogni 10 minuti
        });
    </script>
</body>
</html>
