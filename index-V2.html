<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Farmacia Universale v2.0 - PharmLink</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0a192f; color: white; 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            cursor: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { display: none; }

        #header { 
            flex: 0 0 18vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-bottom: 6px solid #00ff88; position: relative;
            padding: 5px 0;
            transition: background-color 0.5s ease;
        }

        #container-main { flex: 0 0 50vh; padding: 20px; overflow-y: auto; }
        #footer-promo { flex: 0 0 32vh; width: 100%; background-color: white; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #clock { font-size: 1.2rem; color: #00ff88; font-weight: bold; position: absolute; top: 10px; right: 20px; }
        
        .label-static { 
            font-size: 1.6rem; color: #ffffff; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: -10px; opacity: 0.8;
        }

        #txt-nome { 
            display: flex; align-items: center; justify-content: center; gap: 20px; 
            font-size: 3.8rem; font-weight: 900; color: #ffffff; text-transform: uppercase; 
            line-height: 1; margin: 5px 0; text-align: center;
        }

        body.v { flex-direction: column; }
        body.v #header { flex: 0 0 22vh; padding: 10px; }
        body.v #txt-nome { font-size: 2.8rem; text-align: center; flex-wrap: wrap; line-height: 1.1; }
        body.v #container-main { flex: 0 0 48vh; }
        body.v #footer-promo { flex: 0 0 30vh; }

        .croce { color: #00ff88; font-size: 1.2em; animation: pulse-farmacia 2s infinite ease-in-out; }
        @keyframes pulse-farmacia { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        #stato-testo { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; }
        #orario-dettaglio { font-size: 1.1rem; color: #cbd5e1; font-weight: 600; }

        .aperto { background: #064e3b; }
        .chiuso { background: #b91c1c; border-bottom-color: #ff4444 !important; }
        .errore-rete { background: #333333; border-bottom-color: #ffcc00 !important; } 
        
        .testo-aperto { color: #00ff88 !important; }
        .testo-chiuso { color: #ffffff !important; }
        .testo-errore { color: #ffcc00 !important; }
        
        .chiuso .croce { color: white; }
        .errore-rete .croce { color: #777777; animation: none; }

        .titolo-turni { text-align: center; color: #00ff88; font-size: 1.3rem; margin-top: 10px; margin-bottom: 15px; text-transform: uppercase; }
        .card { background: #172a45; margin-bottom: 15px; padding: 15px; border-radius: 15px; border: 2px solid #233554; display: flex; align-items: center; }
        .card-info { flex: 1; }
        .card h3 { color: #00ff88; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 5px; }
        .card p { font-size: 1.3rem; color: #cbd5e1; }
        .qr-wrapper img { width: 90px; height: 90px; border-radius: 8px; border: 2px solid white; }

        /* NUOVA CLASSE: Linea verde separatrice tra le sezioni del body */
        .separatore-sezioni {
            border: none;
            height: 4px;
            background-color: #00ff88;
            margin: 25px 0;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="clock">--:--:--</div>
        <div class="label-static">FARMACIA</div>
        <div id="txt-nome">
            <span class="croce">✚</span>
            <span id="nome-testo-dinamico">CARICAMENTO...</span>
            <span class="croce">✚</span>
        </div>
        <div id="stato-testo">---</div>
        <div id="orario-dettaglio">Sincronizzazione in corso...</div>
    </div>

    <div id="container-main"></div>

    <div id="footer-promo">
        <div style="color: #0a192f; font-weight: 900; font-size: 2rem;">IN ATTESA DATI...</div>
    </div>

        window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen ignorato: ${err.message}`);
                });
            }
        }
        window.addEventListener('click', toggleFullScreen);

        function updateClock() { 
            const ora = new Date().toLocaleTimeString('it-IT');
            if(document.getElementById('clock')) document.getElementById('clock').innerText = ora; 
        }
        setInterval(updateClock, 1000);

            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?timeMin=${timeMin}&maxResults=10&singleEvents=true&orderBy=startTime&key=${GOOGLE_API_KEY}`;

            try {

                const headerEl = document.getElementById('header');

                const dettEl = document.getElementById('orario-dettaglio');

                        const start = new Date(ev.start.dateTime || ev.start.date);

                        const titolo = ev.summary ? ev.summary.toUpperCase() : "";
                        const start = new Date(ev.start.dateTime || ev.start.date);
                        return start > adesso && titolo.includes("APERTO");
                    });

                        const ora = start.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                        
                        if (start.toDateString() === adesso.toDateString()) {
                            return "RIAPRE OGGI ALLE ORE " + ora;
                        }
                        
                        const domani = new Date(adesso);
                        domani.setDate(domani.getDate() + 1);
                        if (start.toDateString() === domani.toDateString()) {
                            return "RIAPRE DOMANI ALLE ORE " + ora;
                        }

                        const dataMese = start.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
                        return `RIAPRE ${giornoSettimana} ${dataMese} ALLE ORE ${ora}`;
                    };
                    
                    if (eventoInCorso) {
                        const titoloInCorso = eventoInCorso.summary ? eventoInCorso.summary.toUpperCase() : "";
                        
                        if (titoloInCorso.includes("APERTO")) {
                            headerEl.className = "aperto"; 
                            statoEl.innerText = "APERTO";
                            statoEl.className = "testo-aperto";
                            const endEv = new Date(eventoInCorso.end.dateTime || eventoInCorso.end.date);
                            const oraFineStr = endEv.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                            dettEl.innerText = "APERTO FINO ALLE ORE " + oraFineStr;
                        } else {
                            headerEl.className = "chiuso"; 
                            statoEl.innerText = titoloInCorso; 
                            statoEl.className = "testo-chiuso";
                            dettEl.innerText = calcolaTestoRiapertura(prossimaApertura);
                        }
                    } else {
                        headerEl.className = "chiuso"; 
                        statoEl.className = "testo-chiuso";

                        const primoFuturoGenerico = data.items.find(ev => new Date(ev.start.dateTime || ev.start.date) > adesso);
                        const titoloProssimo = primoFuturoGenerico && primoFuturoGenerico.summary ? primoFuturoGenerico.summary.toUpperCase() : "";

                        if (titoloProssimo && !titoloProssimo.includes("APERTO")) {
                            statoEl.innerText = titoloProssimo;
                        } else {
                            statoEl.innerText = "ATTUALMENTE CHIUSA";
                        }

                        dettEl.innerText = calcolaTestoRiapertura(prossimaApertura);
                    }

                    statoEl.innerText = "ATTUAL
